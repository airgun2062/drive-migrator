[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
walkdir = "2"
rayon = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
unicode-normalization = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
scraper = "0.20"
csv = "1"
